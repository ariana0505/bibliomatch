name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: docker run -d --name mongo-test -p 127.0.0.1:27017:27017 mongo:8 --replSet rs0 --bind_ip_all
      - name: Initialize test replica set
        run: |
          for attempt in {1..30}; do
            if docker exec mongo-test mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec mongo-test mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      - run: python -m pytest
        env:
          MONGO_TEST_URL: mongodb://localhost:27017/?replicaSet=rs0
          PYTHON_DOTENV_DISABLED: "1"
      - run: node --test tests/frontend.test.cjs
      - run: node --test tests/library.test.mjs
      - run: python -m py_compile api/index.py scripts/seed.py scripts/import_fictional_books.py
