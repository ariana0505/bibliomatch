[project]
name = "bibliomatch"
version = "1.0.0"
description = "Biblioteca escolar con préstamos y herramientas de aprendizaje"
requires-python = ">=3.12,<3.15"
dependencies = [
  "anthropic==0.121.0",
  "flask==3.1.3",
  "pymongo==4.17.0",
  "python-dotenv==1.2.2",
  "werkzeug==3.1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
